<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registro | Produtividade</title>
    <link rel="stylesheet" href="registro.css">
    <link rel="shortcut icon" href="./imagens/favicon produtividade.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="ladoDoFormulario">
            <h3> Preencha os campos abaixo: </h3>
            <div class="divisoriaFormularioCadastro">
                <form action="" method="post">
                    <div class="elementosRegistro">
                        <input 
                        type="text" 
                        name="nomeCadastro" 
                        placeholder=" Nome"
                        id="nomeCadastro">
                    </div>
                    <div class="elementosRegistro">
                        <input 
                        type="text" 
                        name="loginDeRedeCadastro" 
                        placeholder=" Login de rede"
                        id="loginDeRedeCadastro">
                    </div>
                    <div class="elementosRegistro">
                        <input 
                        type="text" 
                        name="senhaCadastro" 
                        placeholder=" Senha"
                        id="senhaCadastro">
                    </div>
                    <div class="elementosRegistro">
                        <input 
                        type="text" 
                        name="emailCorporativo" 
                        placeholder=" E-mail(corporativo)"
                        id="emailCorporativo">
                    </div>
                    <div class="elementosRegistro">
                        <button class="botaoRegistrar"> Registrar </button>
                    </div>
                    <div class="jaCadastrado">
                        <span> Caso já seja cadastrado </span>
                        <a href="Inicio.html"> clique aqui.</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="ladoDaImagem">
            <img src="./imagens/imagem tela inicial.jpg" alt="">
        </div>
    </div>
</body>
</html>
