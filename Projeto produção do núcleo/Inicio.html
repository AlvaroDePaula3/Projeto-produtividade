<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Produtividade</title>
    <link rel="stylesheet" href="inicio.css">
    <link rel="shortcut icon" href="./imagens/favicon produtividade.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="ladoFormulario">
        <h2> Bem vindo(a) ao site de produtividade da Vivo !</h2>
        
        <div class="divisoriaDoFormulario">
            <h3> Insira suas informações para acessar</h3>
            <form action="" method="get">
                <div class="elementosInicio">
                    <input 
                    type="text" 
                    name="loginDeRede" 
                    id="loginDeRede" 
                    placeholder=" Login de rede"
                    required>
                </div>
                <div class="elementosInicio">
                    
                    <!-- O código abaixo faz com que a palavra "senha" fique dentro do input-->
                    <input
                    type="password" 
                    name="senha" 
                    id="senha" 
                    placeholder=" Senha"
                    required>
                </div>
                <!-- Abaixo é o botão de acessar -->
                <div class="containerBotao">
                    <button class="botaoEntrar"> Acessar </button>
                </div>
                <!-- abaixo é o link para caso não tenha feito acesso ainda -->
                <div class="primeiroAcesso">
                    <span>Se for seu primeiro acesso, </span>
                    <a href="registro.html"> clique aqui. </a>
                </div>
            </form>
            </div>
        </div>
            <div class="ladoImagem">
                <img src="./imagens/imagem tela inicial.jpg" alt="Imagem Inicial">
            </div>
    </div>
</body>
</html>
